name: Windows release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        shell: pwsh
        run: |
          dotnet restore CloseLoom.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build CloseLoom.sln -c Release --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test CloseLoom.sln -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: ./scripts/publish-win-x64.ps1 -OutputRoot "${{ runner.temp }}/closeloom-release"
      - name: Verify installer and uninstaller on Windows
        shell: pwsh
        run: ./tests/install-package-smoke.ps1 -PackageZip "${{ runner.temp }}/closeloom-release/CloseLoom-win-x64.zip"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG "${{ runner.temp }}/closeloom-release/CloseLoom-win-x64.zip" "${{ runner.temp }}/closeloom-release/CloseLoom-win-x64.zip.sha256" --generate-notes --verify-tag --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
