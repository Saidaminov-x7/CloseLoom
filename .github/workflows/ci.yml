name: Windows CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CloseLoom.sln
      - run: dotnet build CloseLoom.sln --configuration Release --no-restore -warnaserror
      - run: dotnet test CloseLoom.sln --configuration Release --no-build
      - run: dotnet format CloseLoom.sln --verify-no-changes --no-restore
